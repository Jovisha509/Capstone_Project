
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Device Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #f4f6f9;
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #00000012;
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 0;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }

        input {
            padding: 10px;
            width: 250px;
            max-width: 90%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f5f9;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

        #message {
            margin: 10px 0;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>IoT Device Dashboard</h1>
            <p>Monitor your connected IoT devices</p>
            <p id="currentDate"></p>
        </div>

        <button type="button" onclick="refreshDashboard()">
            Refresh
        </button>
    </header>

    <section class="cards">

        <div class="card">
            <h3>Total Devices</h3>
            <p id="totalDevices">0</p>
        </div>

        <div class="card">
            <h3>Online Devices</h3>
            <p id="onlineDevices">0</p>
        </div>

        <div class="card">
            <h3>Offline Devices</h3>
            <p id="offlineDevices">0</p>
        </div>

        <div class="card">
            <h3>Average Temperature</h3>
            <p id="averageTemperature">0°C</p>
        </div>

    </section>

    <section class="table-container">

        <h2>Device Details</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search device..."
        >

        <p id="message">Loading device details...</p>

        <table>
            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Device Name</th>
                    <th>Status</th>
                    <th>Temperature</th>
                    <th>Humidity</th>
                </tr>
            </thead>

            <tbody id="deviceTable">
                <tr>
                    <td colspan="5">Loading devices...</td>
                </tr>
            </tbody>
        </table>

        <p id="deviceCount">Showing 0 devices</p>

    </section>

    <!-- Load JavaScript at the end of the body -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
